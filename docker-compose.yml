services:
  postgres:
    image: postgres:16-alpine
    container_name: cah-qbank-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cah_qbank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm install && pnpm db:generate && pnpm --filter app ${APP_DEV_SCRIPT:-dev}"
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./:/workspace
    depends_on:
      - postgres

volumes:
  postgres_data:
