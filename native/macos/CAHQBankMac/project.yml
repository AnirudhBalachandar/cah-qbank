name: CAHQBankMac
options:
  deploymentTarget:
    macOS: 26.0
    iOS: 26.0
settings:
  base:
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: 6.0

schemes:
  CAHQBankMac:
    shared: true
    build:
      targets:
        CAHQBankMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CAHQBankMacTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  CAHQBankiOS:
    shared: true
    build:
      targets:
        CAHQBankiOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CAHQBankiOSTests
        - CAHQBankiOSUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  CAHQBankMac:
    type: application
    platform: macOS
    bundleId: com.anirudhbalachandar.CAHQBank
    sources:
      - path: Sources/Shared
        type: syncedFolder
      - path: Sources/Views
        type: syncedFolder
      - path: Sources/Mac
        type: syncedFolder
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/bundled-cah.db
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.anirudhbalachandar.CAHQBank
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
      configs:
        Release:
          CODE_SIGN_IDENTITY: Developer ID Application
          CODE_SIGN_STYLE: Manual
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: --timestamp

  CAHQBankiOS:
    type: application
    platform: iOS
    bundleId: com.anirudhbalachandar.CAHQBank.iOS
    sources:
      - path: Sources/Shared
        type: syncedFolder
      - path: Sources/iOS
        type: syncedFolder
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/bundled-cah.db
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Sources/iOS/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.anirudhbalachandar.CAHQBank.iOS
        DEVELOPMENT_TEAM: 3DELSD6G98
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 1.0
        TARGETED_DEVICE_FAMILY: 1

  CAHQBankMacTests:
    type: bundle.unit-test
    platform: macOS
    bundleId: com.anirudhbalachandar.CAHQBank.Tests
    sources:
      - path: Tests
        type: syncedFolder
        excludes:
          - iOSTests
    settings:
      base:
        INFOPLIST_FILE: Tests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.anirudhbalachandar.CAHQBank.Tests
    dependencies:
      - target: CAHQBankMac

  CAHQBankiOSTests:
    type: bundle.unit-test
    platform: iOS
    bundleId: com.anirudhbalachandar.CAHQBank.iOSTests
    sources:
      - path: Tests/iOSTests
        type: syncedFolder
    settings:
      base:
        INFOPLIST_FILE: Tests/iOSTests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.anirudhbalachandar.CAHQBank.iOSTests
        DEVELOPMENT_TEAM: 3DELSD6G98
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: CAHQBankiOS

  CAHQBankiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    bundleId: com.anirudhbalachandar.CAHQBank.iOSUITests
    sources:
      - path: Tests/iOSUITests
        type: syncedFolder
    settings:
      base:
        INFOPLIST_FILE: Tests/iOSUITests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.anirudhbalachandar.CAHQBank.iOSUITests
        DEVELOPMENT_TEAM: 3DELSD6G98
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: CAHQBankiOS
    dependencies:
      - target: CAHQBankiOS
