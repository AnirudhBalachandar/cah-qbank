name: CAHQBankMac
options:
  deploymentTarget:
    macOS: 26.0
settings:
  base:
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: 6.0

schemes:
  CAHQBankMac:
    shared: true
    build:
      targets:
        CAHQBankMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CAHQBankMacTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  CAHQBankMac:
    type: application
    platform: macOS
    bundleId: com.anirudhbalachandar.CAHQBank
    sources:
      - path: Sources
        type: syncedFolder
    resources:
      - Resources
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.anirudhbalachandar.CAHQBank
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0

  CAHQBankMacTests:
    type: bundle.unit-test
    platform: macOS
    bundleId: com.anirudhbalachandar.CAHQBank.Tests
    sources:
      - path: Tests
        type: syncedFolder
    settings:
      base:
        INFOPLIST_FILE: Tests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.anirudhbalachandar.CAHQBank.Tests
    dependencies:
      - target: CAHQBankMac
